<div class="users">
    <mat-card class="users__card" *ngFor="let user of usersList">
        <!-- Variável mutável chamada user que vai percorrer a variável usersList que é um array que guarda os dados dos usuários  -->
        <mat-card-header>
            <mat-card-title> {{ user.name }} </mat-card-title>
            <mat-card-subtitle> {{ user.email }} </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content></mat-card-content>
    </mat-card>
</div>
